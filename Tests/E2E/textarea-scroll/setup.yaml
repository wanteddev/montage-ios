# Blueprint > TextArea 프리뷰로 이동해 Resize=Fixed, 긴 텍스트 주입 상태를 만든다.
appId: com.wantedlab.Blueprint
---
- launchApp:
    stopApp: true
- tapOn: "Search"
- inputText: "TextArea"
# index 0은 검색 필드의 입력 텍스트에 매칭되므로 리스트 행은 index 1
- tapOn:
    text: "TextArea"
    index: 1
- extendedWaitUntil:
    visible: "Resize :"
    timeout: 5000
- tapOn: "Normal"
- tapOn: "Fixed"
- tapOn: "inject"
- extendedWaitUntil:
    visible: "Options"
    timeout: 3000
