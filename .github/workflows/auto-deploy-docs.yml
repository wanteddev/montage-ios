name: Auto Docs Sync/Deploy on Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate docs
        uses: wanteddev/montage-web/.github/actions/validate-docs@main
        with:
          files: documentation/**/*.{md,mdx}
          mobile-source: true

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: wanteddev
          repositories: montage-web

      - name: Trigger docs-deploy on sync branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run docs-sync.yml \
            --repo wanteddev/montage-web \
            --ref "main" \
            -f platform=ios \
            -f deploy=true
