name: LLM Wiki Pipeline

# v26 = v25 + 비공백 줄 세기를 grep -c → awk 'NF' 로 교체 (구현 의존 제거)
#   동작 변경이 아니라 견고성 개선이다. `awk 'NF'` 는 마지막 줄의 개행 유무와
#   grep 구현 차이에 무관하게 같은 값을 낸다(공백만 있는 줄은 NF=0 이라 제외).
#   비공백 줄 수는 다음 판정에 직접 쓰이므로 세는 방식이 흔들리면 안 된다:
#     - CLAUDE.md 실내용 판정(`-gt 5` → human / pointer). pointer 로 오판하면
#       Handle 의 absent|pointer 분기가 rm -f 후 심링크로 대체한다.
#     - AGENTS.md 사람 영역 판정(0 이면 HUMAN 을 비워 재조립에서 제외한다).
#   개행 없이 끝나는 사람 문서는 실재한다 — saas-ennoia-server/CLAUDE.md 가
#   그렇다(사람이 쓴 6줄, 마지막 줄에 개행 없음). 회귀 스위트 케이스 M 이
#   그 형태를 고정한다.
#   (경위: 조사 중 이 파일이 5줄로 세어져 pointer 오판이 나는 것처럼 보였으나,
#    원인은 조사에 쓴 대화형 셸의 grep shim 이었다. 러너의 /bin/bash 는 실제
#    grep 을 쓰므로 v25 도 6 으로 정확히 셌다. 이 변경으로 고쳐진 실측 결함은
#    없으며, 세는 방식이 환경에 의존하지 않게 만드는 것이 목적이다.)
#   참고: `-gt 5` 임계값 자체는 여전히 자의적이라 경계 파일에 취약하다 —
#   별건으로 남긴다.
#
# v25 = v24 + PR 생성/갱신을 gh pr create|edit → REST(gh api) 로 교체
#   실측 실패(laas-airflow, run 31135524974): 1h13m 산출물이 lint 통과·커밋·push 까지
#   끝난 뒤 PR 스텝만 죽었다.
#     GraphQL: Projects (classic) is being deprecated … (repository.pullRequest.projectCards)
#   `gh pr edit` 의 내부 GraphQL 쿼리가 Projects(classic) 필드를 포함하는데 GitHub 이
#   그 필드를 sunset 하면서 조회 자체가 에러가 되고 gh 가 exit 1 로 죽는다.
#   우리 코드가 아니라 gh 의 낡은 쿼리가 원인이라 인자 조정으로는 못 피한다.
#   → PATCH /repos/{o}/{r}/pulls/{n} 과 POST /repos/{o}/{r}/pulls 로 바꾼다.
#     REST 는 그 필드를 건드리지 않으므로 이 계열 파손이 구조적으로 없다.
#     본문에 백틱·따옴표·개행이 섞이므로 JSON 은 node 로 만든다(문자열 이스케이프).
#   조회용 `gh pr list --json number` 는 projectCards 를 요청하지 않아 그대로 둔다.
#
# v24 = v23 + biz-qa 가 통째로 누락되던 원인 수정 + 빈 버킷 관측/보충
#   실측: 13개 repo 중 10개가 `llm-wiki/biz-qa/` 를 0개로 냈다(domain 18개인
#   wanted-server, 14개인 ai-corequest 도 0). repo 규모·성격과 무관했다.
#   원인: SKILL-PIPELINE Step 3 은 Phase 3a(BIZ-QA)를 **`Agent` 도구로 백그라운드
#   서브에이전트를 띄워** 실행하라고 지시하는데, 이 워크플로우의 --allowedTools 에는
#   Agent/Task 가 없다. 그래서 3a 가 실행되지 못하고, Claude 가 스스로 인라인으로
#   대체한 실행에서만 biz-qa 가 나왔다(3/13) — 그래서 결과가 실행마다 갈렸다.
#   Agent 를 허용하지 않고 프롬프트로 '인라인 순차 실행'을 지시하는 쪽을 택했다:
#   CI 일회성 실행에서 백그라운드 에이전트는 스텝 종료 시점에 완료가 보장되지 않아
#   그 자체가 누락·부분작성의 원인이 되고, 3b(owners)는 수 초라 병렬성 손실이 없다.
#   더 중요한 교훈은 '아무 검사도 이 누락을 걸러내지 못했다'는 점이다.
#   docs-lint 의 applies-to-coverage 는 src/ 최상위 커버리지만 보고, src/ 가 없는
#   repo(laas-airflow 등)에서는 규칙이 조기 반환된다.
#   → (a) Claude 앞에 빈 버킷을 세어 프롬프트로 넘긴다("diff 범위와 무관하게 채워라").
#         diff 모드에서 '변경 없음'과 '문서가 애초에 없음'은 다른 상태인데, diff 범위만
#         보면 후자가 영구히 방치된다. 이미 나간 PR 들의 빈 버킷은 cycle 2 에서 채워진다.
#     (b) 실행 후 재조사해 남은 빈 버킷을 ::warning:: + PR [!WARNING] 로 드러낸다.
#         (정말 쓸 내용이 없는 버킷일 수도 있으므로 실행을 막지는 않는다)
#
# v23 = v22 + 끊긴 인라인 링크 수리 (실측 실패: laas-airflow, 1h23m 산출물 폐기)
#   Claude 는 '쓸 예정이었던' 형제 atom 을 본문에서 참조해두고 실제로는 만들지 않는다.
#   docs-lint 의 broken-link 는 warn 이 아니라 ERROR 라 --strict 이전에 이미 실패하고,
#   커밋·PR 스텝이 skip 되어 한 시간짜리 산출물이 아티팩트로만 남는다.
#   (orphan-doc 은 warn 이라 v17 백필로 해결됐지만 이건 성질이 다르다)
#   → Claude 뒤·Reassemble 앞에 수리 스텝을 둔다. 판정자는 docs-lint 자신(`--json`)이고,
#     수리 순서는 사람 리뷰어가 할 일과 같다:
#       1) 같은 파일명이 트리에 하나만 있으면 경로를 고친다
#       2) 도메인 디렉토리 이름과 일치하면 그 디렉토리의 overview.md 로 고친다
#       3) 어디에도 없으면 링크만 벗긴다(문장 유지) + PR 본문에 목록을 명시
#     related: 항목이 깨진 경우는 링크를 벗길 수 없으므로 그 줄을 걷어낸다.
#   실측 검증: laas-airflow 아티팩트에 적용 → 6 error → 0 error/0 warn,
#   `./airflow-ops.md` 는 `../domain/airflow-ops/overview.md` 로 자동 교정됐다.
#   남은 갭: broken-ref(AGENTS.md 인덱스가 없는 atom 을 가리키는 경우)는 표 행/목록
#   항목을 지워야 해서 수리하지 않는다 — lint 가 파일과 경로를 그대로 찍으므로
#   실패 시 원인이 즉시 보인다.
#
# v22 = v21 + CLAUDE.md 심링크도 스캐폴딩 전에 끊는다 (대상: laas-one-frontend)
#   스캐폴더 소스(0.18.0 src/scaffolder.mjs)를 직접 읽고 확인한 사실 두 가지:
#     (1) 대상 파일이 이미 있으면 '건너뛴다'. 항상 덮어쓰는 건 scripts/** 와
#         _meta/lint-rules.md, _meta/freshness-policy.md 뿐이다.
#         → 워크플로우가 그동안 달고 있던 "스캐폴더가 매번 덮어쓴다"는 전제는
#           틀렸다. v20 에서 관측한 '사람 AGENTS.md 가 시드로 샌다'가 이것의 결과다.
#     (2) 존재 판정이 fs.access 라 심링크를 '따라간다'.
#   그래서 CLAUDE.md → AGENTS.md 심링크인 repo 에서 v20 이 AGENTS.md 를 치우면
#   그 링크가 끊긴 링크가 되고, 스캐폴더가 CLAUDE.md 를 '없는 파일'로 보고 링크를
#   통과해 써버린다 → AGENTS.md 자리에 CLAUDE.md 포인터 템플릿이 들어앉고,
#   AGENTS.md 차례에는 exists()=true 라 진짜 템플릿이 영영 안 만들어진다.
#   어느 쪽이 먼저 처리될지는 readdir 순서라 보장이 없다 — 확률적 파손이다.
#   → Snapshot 에서 CLAUDE.md 심링크도 타깃을 기록하고 끊는다. 복원은 스캐폴드
#     직후의 `git checkout -- CLAUDE.md` 가 하고, 추적되지 않던 링크까지 확실히
#     되돌리도록 Handle CLAUDE.md 의 symlink 분기에 복원 로직을 넣었다.
#   같은 소스로 wanted-server(v15) 의 '라우팅 블록 0줄'도 재해석된다: 덮어쓰기가
#   아니라 AGENTS.md→CLAUDE.md 링크를 따라간 exists()=true 때문에 두 파일 모두
#   보존돼 템플릿이 아예 생성되지 않았던 것이다. v16 의 처방(링크를 끊는다)은
#   이유가 달랐을 뿐 조치는 정확했다.
#
# v21 = v20 + 구 산출 경로(docs/) 잔존 참조 관측 (대상: ennoia-server-framework)
#   0.18 에서 산출 루트가 docs/ → llm-wiki/ 로 바뀌었다. 예전 워크플로우로 이미
#   한 번 돌린 repo 는 (a) docs/ 아래 구 atom 트리가 남아 있고 (b) AGENTS.md 가
#   그 트리를 참조하는 라우팅 문서다. 후자는 state=pipeline 으로 판정돼 SEED 로
#   Claude 에게 넘어가므로, Claude 가 경로를 갈아쓰지 않으면 새 인덱스가 구 트리를
#   가리킨다. 그런데 그 파일들은 실제로 존재하니 docs-lint 의 broken-ref 는
#   통과한다 — 조용히 잘못된 결과가 머지될 수 있는 유일한 경로다.
#   → Reassemble 에서 블록 안의 `docs/**.md` 참조 수를 세어 ::warning:: + PR 본문
#     [!WARNING] 로 드러낸다. 판정이 아니라 관측이므로 실행을 막지는 않는다.
#   (wanted-server 는 구 docs/ 를 미리 치웠던 케이스라 이 증상이 안 나왔다:
#    PR #5390 블록의 docs/ 참조 0회 / llm-wiki/ 참조 109회)
#
# v20 = v19 + 사람이 쓴 AGENTS.md 가 Claude 시드로 새는 문제 (실측: ai-careermate, ai-search-userweb)
#   스캐폴더는 AGENTS.md 가 '이미 실파일로 존재하면 덮어쓰지 않는다'. 그래서
#   state=human repo 에서는 Reduce 의 `elif [ -f AGENTS.md ]` 분기가 집는 파일이
#   스캐폴더 템플릿이 아니라 사람이 쓴 원본 그 자체였다. 로그가 그걸 드러낸다 —
#   시드 줄수가 사람 영역 줄수와 정확히 같았다:
#     ai-agent-hub(AGENTS.md 없음)          사람 0   / 시드 66  ← 진짜 템플릿
#     ai-gigs-expert-agent-core(없음)        사람 0   / 시드 66  ← 진짜 템플릿
#     ai-careermate(사람 파일)               사람 44  / 시드 44  ← 사람 원본이 시드
#     ai-search-userweb(사람 파일)           사람 104 / 시드 104 ← 사람 원본이 시드
#   결과가 두 repo 모두 정상이었던 건 Claude 가 프롬프트를 따라 라우팅 레이어로
#   갈아썼기 때문이다(사람 영역은 HUMAN 에서 따로 복원되므로 중복도 없었다).
#   즉 '운이 좋았다' — Claude 가 시드를 보존·병합하려 들면 사람 텍스트가 마커
#   블록 안에 복제되고, 라우팅 스켈레톤(§4/§5)이 없으니 v15 의 '빈 라우팅' 실패도
#   재현될 수 있다. 결정론이 LLM 판단에 의존하게 된 지점이라 고친다.
#   → Snapshot 에서 state=human 이면 AGENTS.md 를 치운다(내용은 이미 HUMAN 에 복사됨).
#     그러면 스캐폴더가 항상 진짜 템플릿을 쓴다 — 심링크 repo 에서 이미 검증된
#     "치우고 → 스캐폴더가 실파일 생성 → 재조립에서 복원" 경로를 그대로 탄다.
#   → Reduce 에 시드 서명 검증을 추가했다. 템플릿이 아닌 것이 시드로 잡히면
#     ::warning:: 으로 드러낸다(스캐폴더 동작이 또 바뀌면 조용히 새지 않도록).
#
# v19 = v18 + `grep -c ... || echo 0` 제거 (실측 stderr 오류: ai-corequest)
#   grep -c 는 매치 0건일 때 "0" 을 출력하고 '동시에' exit 1 이다. 그래서
#   `$(grep -c ... || echo 0)` 은 값이 "0\n0" 이 되고 [ "0\n0" -gt 0 ] 이
#   "integer expression expected" 로 죽는다. if 조건 안이라 스텝은 살고
#   else 로 빠져 결과는 우연히 맞았지만(사람 영역 없음), 로그에 오류가 남았다.
#   → `|| true` + `${VAR:-0}` 로 바꿨다(파일이 아예 없으면 빈 문자열이 된다).
#   같은 패턴이던 CLAUDE.md 실내용 판정(N)도 같이 고쳤다 — 그쪽은 else 가
#   pointer 라서, CLAUDE.md 가 '공백만 있는 파일'인 repo 에서 human 판정이
#   필요했다면 오판이 될 수 있었다.
#   나머지 grep -c 호출부는 이미 안전하다: `|| true` + ${:-0} 이거나,
#   echo 인자 안(치환 실패가 echo 종료코드를 바꾸지 않음)이거나,
#   v18 이 errexit 을 끈 orphan 백필 구간 안이다.
#
# v18 = v17 + orphan 백필 블록이 스텝을 죽이지 않게 (실측 실패: calendar-api)
#   v17 의 링크 수집 파이프라인 `{ grep; grep; grep; } | sort -u` 는 grep 이 매치
#   0건일 때 exit 1 을 반환하고, pipefail + set -e 조합에서 그것만으로 스텝이 죽는다.
#   calendar-api 에서 Reassemble 이 출력 한 줄 없이 exit 1 로 실패했다.
#   (로컬 리허설이 통과한 건 픽스처에 백틱 참조·related:·인라인 링크가 전부 있어
#    세 grep 이 모두 매치했기 때문 — 픽스처 설계 실수였다)
#   → orphan 백필은 '보조 기능'이므로 그 구간에서만 errexit/pipefail 을 끈다.
#     실패하면 백필이 없을 뿐이고, 그 결과는 docs-lint 가 드러낸다.
#   리허설 픽스처에 링크전무 / 백틱만 / related만 / atom없음 4가지를 추가했다.
#
# v17 = v16 + orphan atom 자동 백필 (실측 실패 반영: calendar-api docs-lint 실패)
#   docs-lint --strict 는 warn 도 실패로 취급하고, orphan-doc 은 "어디서도 링크되지
#   않은 atom"을 warn 한다. SKILL-PIPELINE 은 Phase 1(메인 SKILL.md)이 §5 인덱스를
#   완성한 '뒤' Phase 3a(BIZ-QA)가 atom 을 더 만들기 때문에 그 atom 들이 인덱스에
#   편입되지 않는다. calendar-api 에서 llm-wiki/biz-qa/ 5건이 orphan 으로 잡혀
#   0 error / 5 warn 으로 실패했다(wanted-server 는 biz-qa 산출물이 0건이라 통과).
#   → Reassemble 이 링크 그래프를 계산해(AGENTS.md 백틱 참조 + atom 의 related: +
#     atom 본문 마크다운 링크) 누락 atom 을 '미분류' 섹션으로 자동 링크하고 경고한다.
#     결정론적이고, 마커 블록 안이라 다음 실행에서 정상 인덱스로 대체된다.
#
# v16 = v15 + 심링크 처리 재설계 (실측 실패 반영: 라우팅 블록이 0줄로 나왔다)
#   wanted-server 실전 실행에서 atom 134개를 만들고도 AGENTS.md 의 llm-wiki 블록이
#   비어 있었다. 원인은 v15 의 "사람 영역 있으면 파이프라인 영역을 비워서 넘긴다"다.
#   스캐폴더는 AGENTS.md(심링크 통과 → CLAUDE.md)에 템플릿을 쓴 '직후' CLAUDE.md 에
#   포인터를 덮어쓴다. 즉 템플릿이 스캐폴더 내부에서 이미 파괴되므로 백업도 무의미하다.
#   재설계: 스캐폴딩 전에 심링크를 끊어 스캐폴더가 '실파일' AGENTS.md 를 만들게 하고,
#           재조립 때 내용을 링크 대상에 쓰고 심링크를 복원한다.
#           → 심링크 repo 가 일반 경로를 그대로 탄다.
#   - Snapshot: 링크 대상 읽기 → 사람 영역(HUMAN) + 지난 블록(SEED) 분리 → 링크 끊기
#   - Reduce: 단일 규칙으로 축소 — SEED 있으면 그것, 없으면 스캐폴더 템플릿을 시드로
#   - Reassemble: 링크 대상에 [사람 영역 + 마커 블록] 기록 후 심링크 복원
#   - 블록이 5줄 미만이면 ::warning:: + PR 본문 경고 (docs-lint 가 못 잡는 품질 문제)
#
# v15 = v14 + AGENTS.md 심링크 방향 대응 + 대형 repo 타임아웃
#   wanted-server 는 AGENTS.md 가 심링크(→ CLAUDE.md)이고 CLAUDE.md 가 실파일이다.
#   우리 가정과 반대라, v14 로는 AGENTS.md 에 쓰는 모든 동작이 링크를 통과해
#   CLAUDE.md(사람 작성 119줄)를 파괴했다.
#   - Snapshot 이 심링크를 해석해 '실제 파일'(agents_file)을 정본으로 삼는다.
#     Reduce·Reassemble 도 그 파일만 다루고 심링크 자체는 건드리지 않는다.
#   - Reduce 규칙 추가: 마커 없음 + 사람 영역 있음 → 파이프라인 영역을 비워서 넘긴다.
#     (심링크 repo 는 스캐폴더의 덮어쓰기가 CLAUDE.md 복원으로 되돌려져 사람 내용이
#      남는다. 그대로 Claude 에게 넘기면 재조립 때 중복된다)
#   - claude_kind=agents_target 신설: CLAUDE.md 가 심링크 대상이면 포인터 블록도
#     심링크 변환도 불필요하다.
#   - 타임아웃 상향: Claude 스텝 120→240분, job 180→300분.
#     gigs-frontend(소형 프론트)가 54분이었고 70MB 급 모노리스는 훨씬 길다.
#
# v14 = v13 + AGENTS.md 소유권 충돌 해소 ("덮어쓰지 않고 내 영역만 덧붙인다")
#   AGENTS.md 는 Codex·Claude Code·Antigravity 가 공유하는 사실상 표준이고,
#   8개 repo 중 3개는 사람이 직접 쓴 AGENTS.md 를 이미 갖고 있었다. 그런데 v13 은
#   AGENTS.md 를 "파이프라인 소유"로 분류해 full 모드에서 스캐폴더가 덮어쓰게 뒀다
#   → 보호 장치 없이 유실. 전제가 틀렸다.
#   해결: llm-wiki 영역을 마커로 감싸고 그 안쪽만 갱신한다.
#     - Snapshot original agent docs (Scaffold 앞): 사람 영역 분리 보관
#       판정 = 마커 있음 / 스캐폴더 서명 있음(파이프라인 소유) / 그 외(사람 소유)
#     - Reduce AGENTS.md to pipeline region (Claude 앞): 마커 안쪽만 넘김
#     - Reassemble AGENTS.md (Claude 뒤): 사람 영역 + 마커 블록으로 결정론적 재조립
#     - Handle CLAUDE.md: 실내용이면 심링크 변환하지 않고 포인터 블록만 덧붙임
#     - PR 본문: 사람 파일을 건드린 경우에만 상단에 확인 요청 경고
#   부수 효과: "CLAUDE.md 를 AGENTS.md 로 병합" 지시와 그 검증 장치(SUBSTANTIVE
#   판정, 해시 가드)가 전부 불필요해져 삭제했다. LLM 의존 지점이 하나 줄었다.
#
# v13 = v12 + 실측 실패 2건 수정 (gigs-frontend full 실행)
#   Claude 스텝은 54분 만에 완주하고 docs-lint 도 통과했는데 커밋 직전에 죽었다.
#   1) git add 가 .gitignore 대상 pathspec 을 받으면 exit 1 → set -e 로 스텝 종료.
#      gigs-frontend 는 .claude 를 ignore 한다. check-ignore 로 건너뛴다(-f 강제 금지).
#   2) 실패 artifact 업로드 스텝이 커밋 스텝보다 앞에 있어, 커밋 실패 시 산출물을
#      전혀 보존하지 못했다(54분 결과물 유실). 잡의 맨 뒤로 이동.
#   3) diff 범위에서 scripts/docs-lint.mjs·owners-from-git.mjs 제외 (로컬 리허설에서
#      발견). 스캐폴더 소유 파일이 한 번 커밋되면 버전 상향마다 "소스 변경"으로
#      집계돼 불필요한 재생성을 유발한다. scripts/ 전체는 실제 소스라 제외하지 않는다.
#   참고: allowlist 에 추가한 node 스크립트가 실제로 동작했다
#   (`node scripts/owners-from-git.mjs --scan-authors` 실행 확인).
#   승인 거부 8건은 모두 cd/cat/find/sed/ls 조합이며 진행을 막지는 않았다.
#
# v12 = v11 + 프롬프트/스킬 중복 제거 (hang 원인 제거)
#   정본은 .claude/skills/llm-wiki/SKILL.md 다. 프롬프트에서 아래를 삭제:
#     - 출력 경로 (SKILL.md frontmatter·outputs 가 llm-wiki/<bucket>/ 로 정의)
#     - 한국어/프론트매터 키 규칙 (SKILL.md ## Output language 가 더 정밀)
#     - owner 산출 규칙 (SKILL.md {{owner-from-AGENTS.md}} + owners-from-git.mjs)
#     - Antigravity/GEMINI.md 장문 설명 (SKILL.md ## Runtime-specific install paths)
#   owner 규칙은 중복일 뿐 아니라 hang 의 직접 원인이었다: Claude 가 email →
#   GitHub handle 변환에 allowlist 밖의 `gh api` 를 호출해 승인 대기로 정지했다
#   (비대화형 Actions 에서는 승인이 올 수 없다. 로그의 "requires approval" 확인).
#   allowlist 에 node 스크립트 2개 추가 — 없으면 SKILL.md Step 6 lint 루프와
#   SKILL-PIPELINE Phase 3b(owners-from-git.mjs)가 실행 자체가 불가능하다.
#
# v11 = v10 + 문서 루트 변수화 (실측 실패 반영)
#   스캐폴더 0.18.0 이 문서 루트를 docs/ → 리포지토리 루트 llm-wiki/ 로 바꿨는데
#   워크플로우가 docs/ 를 가리킨 채로 돌아, Claude 가 55분간 생성한 파일이
#   git add 대상에서 전부 빠지는 상태였다(실패도 아니고 "변경 없음"으로 끝난다).
#   - env.DOCS_ROOT 도입, 모든 경로 참조를 이 변수로 통일
#   - Scaffold 직후 문서 루트 존재 검증 추가 → 같은 실패를 1초에 잡는다
#
# v10 = v9 + Gemini CLI → Antigravity CLI 대응
#   근거: https://antigravity.google/docs/cli/gcli-migration
#   - GEMINI.md 는 그대로 둔다. Antigravity CLI 가 AGENTS.md 와 동등하게 계속 읽고,
#     파일명 변경·폐기 예정이 없다("No modifications are needed to your existing
#     rule documents"). 새 파일명(ANTIGRAVITY.md 등)도 없다.
#   - 문서가 "수동 이동 필요"로 명시한 유일한 항목만 자동화: 워크스페이스 스킬
#     .gemini/skills/ → .agents/skills/ (Migrate 스텝 신설, LLM 무관·멱등)
#   - .agents/ 를 커밋 대상에, .agents|.gemini 를 diff 범위 제외에 추가
#   - Preflight 에 CLAUDE_CODE_OAUTH_TOKEN 존재 확인 추가(신규 repo 배포 대비)
#
# v9 = v6 + 실전 검증 반영
#   - persist-credentials: false + 커스텀 credential helper 하드닝을 철회.
#     Claude 스텝 이후 push 가 일관되게 403 으로 실패했고(프로브는 통과, 11분 뒤
#     커밋만 실패, 토큰 만료로도 설명 안 됨), 원본의 검증된 경로로 되돌렸다.
#   - Preflight(gh/core.symlinks) + Verify push auth(fail fast) 스텝 추가:
#     인증/권한 문제를 Claude 실행 전 1분 내에 잡는다.
#
# v6 = v5 + id-token: write 복원 (실측 실패 반영)
#   claude-code-action@v1 이 setupGitHubToken() 에서 OIDC 교환을 하므로 필수.
#   v5 에서 "미사용 권한"으로 오판해 제거했다가 Claude 스텝이 3회 재시도 후 실패했다.
#
# v5 = v4 + G/H 반영
#   G: full 모드에서 스캐폴더가 CLAUDE.md 를 포인터로 덮어쓴 뒤 Claude 에 넘겨,
#      "CLAUDE.md 고유 지침 → AGENTS.md 병합"이 원리적으로 불가능해지고
#      SUBSTANTIVE=false 로 가드까지 통과해 원본이 조용히 심링크로 대체되던 문제.
#   H: GEMINI.md 가 원복 목록에 없어 스캐폴더가 매 실행 덮어쓰고 커밋되던 문제.
#   → 원복 기준을 "모드"가 아니라 "파일 소유권"으로 재정의해 한 번에 해소.
#
# 설계 원칙: 생성(Claude)과 버전관리(셸)의 완전 분리,
#            LLM 자기보고가 아닌 독립 lint 검증, 최소 권한 툴셋.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드: diff(변경분만 갱신, 기본값) 또는 full(전체 재생성)'
        type: choice
        options: [diff, full]
        default: diff

concurrency:
  group: llm-wiki-${{ github.repository }}
  cancel-in-progress: true

env:
  # [C] 버전 핀은 선택이 아니라 전제조건이다.
  # 원복 로직(B) 때문에 scripts/ 는 스캐폴더 버전, docs/ 는 HEAD 상태로 갈라진다.
  # latest 로 두면 스캐폴더가 스키마를 바꾼 순간 새 lint 가 옛 docs 를 검사해
  # 전 repo 가 동시에 red 가 된다. 업그레이드는 "핀 변경 + full 실행" 한 쌍으로만.
  # ↓ 롤아웃 전 `npm view @wanteddev/create-llm-wiki version` 결과로 교체할 것
  CREATE_LLM_WIKI_VERSION: "0.18.0"
  # 문서 루트. 스캐폴더 0.18.0 부터 docs/ 가 아니라 리포지토리 루트의 llm-wiki/ 에 쓴다.
  # 워크플로우의 모든 경로 참조가 이 값을 쓰므로, 스캐폴더가 루트를 또 바꾸면
  # 여기 한 줄만 고치면 된다. (0.16 → 0.18 에서 실제로 바뀌었고, 그때 워크플로우가
  # docs/ 를 가리킨 채로 돌아 생성물이 하나도 스테이징되지 않았다.)
  DOCS_ROOT: llm-wiki
  DOCS_BRANCH: docs/llm-wiki-populate-ko
  BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
  DIFF_FILE_LIMIT: 300

jobs:
  llm-wiki:
    runs-on: self-hosted
    timeout-minutes: 300   # 대형 모노리스(wanted-server 70MB 등)에서 Claude 스텝 240분을 감싸야 한다
    permissions:
      contents: write
      pull-requests: write
      packages: read
      # ⚠ 제거하지 말 것. claude-code-action@v1 은 setupGitHubToken() 에서 OIDC
      #   토큰을 GitHub App 토큰으로 교환한다. 없으면 Claude 스텝이
      #   "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable" 로 3회 재시도 후 실패한다.
      #   (워크플로우 자체가 OIDC 를 직접 쓰지 않아 불필요해 보이지만 액션이 쓴다)
      id-token: write

    steps:
      # TODO: contents:write + self-hosted 조합이므로 액션을 commit SHA 로 핀하는 것이
      #       표준 하드닝. (SHA 는 조직에서 확정해 채울 것)
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # diff 모드의 git log / origin refs 전체 필요
          # persist-credentials 는 기본값(true)을 쓴다.
          # 한때 false + push 시점 커스텀 credential helper 로 하드닝을 시도했으나,
          # Claude 스텝 이후 push 가 일관되게 403("Invalid username or token")으로
          # 실패했다. 프로브(초반 2분)는 읽기·쓰기 모두 통과하고 커밋 스텝(11분 후)만
          # 실패했으며, GITHUB_TOKEN 만료(1시간)로도 설명되지 않았다.
          # 검증된 경로(actions/checkout 의 http.extraheader)로 되돌린다.
          #
          # 트레이드오프: 토큰이 .git/config 에 남아 Claude 의 Read 로 읽힐 수 있다.
          #  - 유출 경로는 좁다: 네트워크 툴 없음, git/gh 쓰기 명령 미허용.
          #  - 근본 해결은 ephemeral 러너다(현재 org-level 상시 러너 1대 공유 구조라
          #    적용 불가). 하드닝을 재시도할 땐 Claude 스텝 없는 최소 워크플로우로
          #    먼저 검증할 것 — 실제 파이프라인에서 디버깅하면 1회 12분씩 든다.

      # [E] core.symlinks 를 여기서 켠다. 뒤쪽 변환 스텝에서 켜면
      #     Scaffold 단계의 `git checkout -- CLAUDE.md` 가 HEAD 의 심링크를
      #     일반 파일로 복원해버릴 수 있다.
      #     (checkout 시점에 심링크가 일반 파일로 떨어졌더라도, 지금 켜두면 git 이
      #      index 의 120000 과 워킹트리 일반 파일을 불일치로 보고 제대로 복원한다)
      # 2초짜리 preflight: gh 는 인증 프로브와 PR 스텝 양쪽의 전제다.
      # 없으면 121분 뒤에 발견된다.
      - name: Preflight
        env:
          # secret 존재 여부만 본다(값은 노출되지 않는다).
          # repo 마다 org secret 범위가 다를 수 있어, 신규 repo 배포 시 가장 흔한
          # 실패 지점이다. 없으면 Claude 스텝까지 가지 않고 2초에 끝낸다.
          CLAUDE_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo "::error::gh CLI not found on this runner"; exit 1; }
          if [ "$CLAUDE_TOKEN_SET" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret 이 이 repo 에서 보이지 않습니다."
            echo "::error::org secret 의 'Repository access' 범위에 이 repo 가 포함돼 있는지 확인하세요."
            exit 1
          fi
          git config core.symlinks true

      # push 인증을 Claude 실행 '전'에 검증한다. 이게 없으면 인증 문제를
      # 120분 뒤 Commit 스텝에서야 발견한다(실측으로 두 번 겪었다).
      - name: Verify push auth (fail fast)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 인증은 actions/checkout 이 심어둔 http.extraheader 를 그대로 쓴다.
          # 진단용으로 자격증명 관련 config 를 출처와 함께 남긴다(값은 마스킹).
          # 인증 문제가 재발하면 이 출력이 1차 단서다.
          echo "--- git config (auth 관련, redacted) ---"
          git config --local --list --show-origin \
            | grep -Ei 'credential|extraheader|insteadof|remote\..*\.url' \
            | sed -E -e 's/(extraheader=).*/\1***/' -e 's#://[^@/]*@#://***@#' \
            || echo "(none)"

          # repo 상태 점검. fork 와 archived 는 repo Settings 가 "Read and write" 여도
          # GITHUB_TOKEN 을 강제로 read-only 로 만든다(각각 GitHub 정책/저장소 동결).
          # permissions.push 는 App 설치 토큰에서 부정확할 수 있어 참고용으로만 찍는다.
          echo "--- repo state ---"
          gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '"fork=\(.fork) archived=\(.archived) visibility=\(.visibility) default_branch=\(.default_branch) permissions.push=\(.permissions.push // false)"'
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.archived')" = "true" ]; then
            echo "::error::저장소가 archived 상태입니다 — 모든 push 가 차단됩니다."
            exit 1
          fi
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.fork')" = "true" ]; then
            echo "::error::fork 저장소에서는 GITHUB_TOKEN 이 항상 read-only 입니다 — 별도 PAT/App 토큰이 필요합니다."
            exit 1
          fi

          # 실제 쓰기 인증 검사. --dry-run 도 git-receive-pack 인증을 거치므로
          # (잘못된 토큰으로 재현 확인함) read-only 토큰이면 여기서 정확히 실패하고
          # ref 는 생성되지 않는다. 브랜치명은 비-fast-forward 노이즈를 피하려
          # run 단위 임시 이름을 쓴다.
          # ⚠ 이 프로브는 ref 이름이 실제 브랜치와 다르므로, docs/* 에 걸린
          #   ruleset 은 잡지 못한다(그 경우 에러 메시지가 GH006/rule violations 로 다름).
          echo "--- git write auth probe (dry-run, 부작용 없음) ---"
          if git push --dry-run origin "HEAD:refs/heads/ci-auth-probe-${GITHUB_RUN_ID}"; then
            echo "OK: push 인증 성공 (쓰기 가능)"
          else
            echo "::error::push 인증 실패. repo/org Settings → Actions → General → Workflow permissions 와"
            echo "::error::이 run 의 'Set up job' 로그의 GITHUB_TOKEN Permissions(Contents: write)를 확인하세요."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wanteddev'

      # 모드 판정을 LLM 이 아니라 셸에서 결정론적으로 수행한다.
      # Scaffold 보다 먼저 실행: 스캐폴더가 docs/ 를 건드리기 전에 원본 기준으로
      # 판정해야 하고, 판정 자체는 git 이력만 쓰므로 순서 이동에 부작용이 없다.
      - name: Resolve diff scope
        id: scope
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          if [ "$REQUESTED_MODE" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=사용자가 full 모드로 실행" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # git --grep 은 기본 BRE 라 괄호가 리터럴로 매칭된다.
          BASE=$(git log -1 --grep='^docs(llm-wiki):' --format=%H || true)
          if [ -z "$BASE" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=이전 docs(llm-wiki): 커밋 없음 → 전체 생성" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 파이프라인 자신의 산출물은 변경 대상에서 제외한다.
          # 파이프라인 산출물 + 에이전트 설정 자산은 "소스 변경"으로 세지 않는다.
          # (.agents/.gemini 는 Antigravity CLI 자산 — 이것들이 바뀌었다고 docs 를
          #  재생성할 이유가 없다)
          git diff --name-only "$BASE"..HEAD -- . \
            ":(exclude)${DOCS_ROOT}/**" \
            ':(exclude)docs/**' \
            ':(exclude).claude/**' \
            ':(exclude).agents/**' \
            ':(exclude).gemini/**' \
            ':(exclude)AGENTS.md' \
            ':(exclude)CLAUDE.md' \
            ':(exclude)GEMINI.md' \
            ':(exclude)scripts/docs-lint.mjs' \
            ':(exclude)scripts/owners-from-git.mjs' \
            > "$RUNNER_TEMP/changed-files.txt" || true
          # scripts/ 전체를 제외하지 않는 이유: 대부분 repo 에서 scripts/ 는 실제 소스다
          # (gigs-frontend 에도 있다). 스캐폴더가 소유한 두 파일만 콕 집어 제외한다 —
          # 파이프라인은 이 파일들을 커밋하지 않지만, 개발자가 `git add -A` 로 한 번
          # 커밋해두면 스캐폴더 버전을 올릴 때마다 "소스 변경"으로 집계된다.
          # docs/** 는 스캐폴더 0.16 이하 시절의 잔존 트리를 위한 레거시 제외다.
          # 그 시절 문서가 머지된 repo 에서 옛 트리 변경이 "소스 변경"으로 집계되는 것을 막는다.

          COUNT=$(awk 'NF' "$RUNNER_TEMP/changed-files.txt" | wc -l | tr -d ' ')
          COUNT=${COUNT:-0}
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            # 소스 변경이 없으면 Claude 를 아예 호출하지 않는다. 최대 비용 절감 지점.
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "reason=$BASE 이후 소스 변경 없음 → 생성 생략" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" -gt "$DIFF_FILE_LIMIT" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=변경 파일 ${COUNT}개 > ${DIFF_FILE_LIMIT} → full 로 승격" >> "$GITHUB_OUTPUT"
          else
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "reason=$BASE 이후 변경 파일 ${COUNT}개" >> "$GITHUB_OUTPUT"
            LIST=$(paste -sd '|' "$RUNNER_TEMP/changed-files.txt" | sed 's/|/, /g')
            echo "changed_list=$LIST" >> "$GITHUB_OUTPUT"
          fi

      # 원칙: 파이프라인은 기존 .md 원본을 덮어쓰지 않는다. 자기 영역을 마커로 감싸
      #       덧붙이고, 다음 실행에서는 그 영역만 갈아끼운다(누적 방지).
      #
      # 이 스텝은 반드시 Scaffold '앞'에 있어야 한다 — 스캐폴더가 AGENTS.md 를
      # 덮어쓰기 때문에, 사람이 쓴 영역은 그 전에 떼어내 보관해야 한다.
      #
      # AGENTS.md 판정 (결정론적):
      #   마커 블록 있음        → 마커 앞부분이 사람 영역
      #   마커 없음 + 서명 있음  → 전체가 파이프라인 산출물 (사람 영역 없음)
      #   마커 없음 + 서명 없음  → 전체가 사람 영역
      # 서명은 스캐폴더 템플릿의 고정 문구다. 실측으로 판별력을 확인했다:
      #   wanteddev-pulse(파이프라인 작성) = 1 / 사람 작성 3개 = 0
      - name: Snapshot original agent docs
        id: snapshot
        run: |
          set -euo pipefail
          HUMAN="$RUNNER_TEMP/AGENTS.human.md"   # 사람이 쓴 영역 (마커 앞)
          SEED="$RUNNER_TEMP/AGENTS.seed.md"     # 지난 실행의 llm-wiki 블록 (마커 안)
          : > "$HUMAN"; : > "$SEED"
          STATE=absent

          # AGENTS.md 가 심링크인 repo 가 있다(wanted-server: AGENTS.md → CLAUDE.md).
          # 그 경우 AGENTS.md 에 쓰면 링크를 통과해 대상 파일이 덮어써진다. 게다가
          # 스캐폴더는 AGENTS.md 를 쓴 직후 CLAUDE.md 에 포인터를 덮어쓰므로,
          # 템플릿이 스캐폴더 내부에서 이미 파괴된다(실측: 라우팅 블록이 0줄).
          # → 스캐폴딩 전에 심링크를 끊어 스캐폴더가 '실파일' AGENTS.md 를 만들게 하고,
          #   재조립 단계에서 내용을 대상 파일에 쓰고 심링크를 복원한다.
          #   이러면 심링크 repo 가 일반 경로를 그대로 탄다.
          AGENTS_FILE=AGENTS.md
          LINK_TARGET=""
          if [ -L AGENTS.md ]; then
            LINK_TARGET=$(readlink AGENTS.md)
            if [ -n "$LINK_TARGET" ] && [ -f "$LINK_TARGET" ]; then
              AGENTS_FILE="$LINK_TARGET"
            fi
            echo "::notice::AGENTS.md 는 심링크입니다 → 내용 파일은 ${AGENTS_FILE}. 스캐폴딩 동안 링크를 끊고 재조립 시 복원합니다."
          fi
          echo "agents_file=$AGENTS_FILE" >> "$GITHUB_OUTPUT"
          echo "agents_link_target=$LINK_TARGET" >> "$GITHUB_OUTPUT"

          if [ -f "$AGENTS_FILE" ]; then
            if grep -q '<!-- BEGIN: llm-wiki' "$AGENTS_FILE"; then
              sed '/<!-- BEGIN: llm-wiki/,$d' "$AGENTS_FILE" > "$HUMAN"
              sed -n '/<!-- BEGIN: llm-wiki/,/<!-- END: llm-wiki/p' "$AGENTS_FILE" \
                | sed -e '/<!-- BEGIN: llm-wiki/d' -e '/<!-- END: llm-wiki/d' > "$SEED"
              STATE=marker
            elif grep -q '이 파일은 라우팅 레이어다' "$AGENTS_FILE" \
              || { grep -q '^## 4\. Routing' "$AGENTS_FILE" && grep -q '^## 5\. Knowledge Index' "$AGENTS_FILE"; }; then
              cp "$AGENTS_FILE" "$SEED"
              STATE=pipeline
            else
              cp "$AGENTS_FILE" "$HUMAN"
              STATE=human
            fi
          fi

          # 심링크는 여기서 끊는다(위에서 대상 파일을 이미 읽었다).
          if [ -n "$LINK_TARGET" ]; then rm -f AGENTS.md; fi

          # 사람이 쓴 AGENTS.md 도 치운다. 내용은 위에서 이미 HUMAN 에 복사했다.
          # 스캐폴더는 AGENTS.md 가 실파일로 존재하면 덮어쓰지 않기 때문에, 이걸
          # 두면 Reduce 가 '스캐폴더 템플릿'이라고 집는 파일이 사람 원본이 된다
          # (실측: ai-careermate 시드 44줄 = 사람 44줄 / ai-search-userweb 104=104).
          # 치우면 스캐폴더가 진짜 템플릿을 만들고, 사람 영역은 재조립에서 복원된다.
          #
          # 심링크 repo 는 대상에서 제외한다($AGENTS_FILE 이 CLAUDE.md 같은 '다른
          # 파일'을 가리키므로 지우면 사람 문서를 날린다). 그쪽은 바로 위에서 심링크
          # 자체를 이미 끊었고, 그것만으로 스캐폴더가 실파일 템플릿을 만든다
          # (실측: wanted-server 시드 66줄 = 진짜 템플릿).
          if [ "$STATE" = human ] && [ -z "$LINK_TARGET" ]; then
            rm -f AGENTS.md
            echo "사람이 쓴 AGENTS.md 를 치웠습니다 — 스캐폴더가 라우팅 템플릿을 만들고, 재조립 단계에서 원본을 복원합니다"
          fi

          # 공백만 남은 사람 영역은 없는 것으로 취급한다.
          # 세는 방법이 grep 이 아니라 awk 인 이유(v26): 이 값이 '사람 문서를
          # 보존할지 말지'를 가르므로 세는 방식이 환경에 의존하면 안 된다.
          # awk 'NF' 는 마지막 줄의 개행 유무·grep 구현과 무관하게 같은 값을 낸다
          # (공백만 있는 줄은 NF=0 이라 제외). 개행 없이 끝나는 사람 문서는
          # 실재한다 — saas-ennoia-server/CLAUDE.md.
          HUMAN_LINES=$(awk 'NF' "$HUMAN" 2>/dev/null | wc -l | tr -d ' ')
          if [ "${HUMAN_LINES:-0}" -gt 0 ]; then
            echo "agents_human=true" >> "$GITHUB_OUTPUT"
            echo "AGENTS.md: 사람 영역 ${HUMAN_LINES}줄 보관 (state=$STATE)"
          else
            : > "$HUMAN"
            echo "agents_human=false" >> "$GITHUB_OUTPUT"
            echo "AGENTS.md: 사람 영역 없음 (state=$STATE)"
          fi
          echo "agents_state=$STATE" >> "$GITHUB_OUTPUT"

          # CLAUDE.md 분류. human 이면 심링크로 바꾸지 않고 원본을 보존한다.
          CK=absent
          if [ "$AGENTS_FILE" = "CLAUDE.md" ]; then
            # AGENTS.md 심링크의 대상이 CLAUDE.md 인 경우. 마커 블록이 이 파일에
            # 들어가므로 별도 포인터 블록도, 심링크 변환도 필요 없다.
            CK=agents_target
          elif [ -L CLAUDE.md ]; then
            CK=symlink
          elif [ -f CLAUDE.md ]; then
            sed -e '/<!-- BEGIN: llm-wiki/,/<!-- END: llm-wiki/d' CLAUDE.md > "$RUNNER_TEMP/CLAUDE.body.md"
            # `|| echo 0` 금지 — 위 HUMAN_LINES 주석 참고(값이 "0\n0" 이 된다).
            N=$(awk 'NF' "$RUNNER_TEMP/CLAUDE.body.md" 2>/dev/null | wc -l | tr -d ' ')
            if [ "${N:-0}" -gt 5 ]; then CK=human; else CK=pointer; fi
          fi
          echo "claude_kind=$CK" >> "$GITHUB_OUTPUT"
          echo "CLAUDE.md: $CK"

          # CLAUDE.md 가 심링크면 그것도 끊는다(타깃을 기록해 두고 Handle 에서 복원).
          #
          # 스캐폴더는 대상 파일이 이미 있으면 건너뛴다(scaffolder.mjs 의 exists()).
          # 그런데 exists() 는 fs.access 라서 '심링크를 따라간다'. 그래서 CLAUDE.md 가
          # AGENTS.md 를 가리키는 심링크인 repo(laas-one-frontend)에서 위쪽이
          # AGENTS.md 를 치우면 이 링크가 끊긴 링크가 되고, 스캐폴더가 CLAUDE.md 를
          # '없는 파일'로 보고 링크를 통과해 써버린다 → AGENTS.md 자리에 CLAUDE.md
          # 템플릿(포인터)이 들어앉는다. 그 다음 AGENTS.md 차례에는 exists()=true 라
          # 진짜 템플릿이 영영 만들어지지 않는다.
          # 어느 쪽이 먼저 처리되는지는 readdir 순서라 보장이 없다 — 확률적 파손이다.
          # 링크를 끊어 두면 스캐폴더가 두 파일을 각각 실파일로 만들고, 링크는
          # 스캐폴드 직후의 `git checkout -- CLAUDE.md` 와 Handle 스텝이 되돌린다.
          CLT=""
          if [ -L CLAUDE.md ]; then
            CLT=$(readlink CLAUDE.md)
            rm -f CLAUDE.md
            echo "CLAUDE.md 심링크(→ ${CLT})를 스캐폴딩 동안 끊습니다 — 재조립 후 복원합니다"
          fi
          echo "claude_link_target=$CLT" >> "$GITHUB_OUTPUT"

      - name: Scaffold llm-wiki
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.scope.outputs.mode }}
          AGENTS_FILE: ${{ steps.snapshot.outputs.agents_file }}
        run: |
          set -euo pipefail
          npx "@wanteddev/create-llm-wiki@${CREATE_LLM_WIKI_VERSION}" . --yes
          if [ ! -f scripts/docs-lint.mjs ]; then
            echo "::error::scaffolding did not produce scripts/docs-lint.mjs"
            exit 1
          fi

          # 문서 루트 존재 검증. 스캐폴더가 루트를 바꾸면(0.16 docs/ → 0.18 llm-wiki/)
          # 워크플로우의 모든 경로가 조용히 빗나가고, Claude 가 한 시간 작업한 산출물이
          # 스테이징되지 않은 채 "변경 없음"으로 끝난다. 그 실패를 1초에 잡는다.
          if [ ! -d "$DOCS_ROOT" ]; then
            echo "::error::문서 루트 '$DOCS_ROOT' 가 스캐폴딩 후에도 없습니다."
            echo "::error::스캐폴더 ${CREATE_LLM_WIKI_VERSION} 이 루트 경로를 바꿨을 수 있습니다. env.DOCS_ROOT 를 확인하세요."
            echo "리포지토리 루트의 디렉토리 목록:"; ls -d */ 2>/dev/null | head -20
            exit 1
          fi

          # ── 원복 기준은 "모드"가 아니라 "파일 소유권"이다 ─────────────────────
          # 스캐폴더의 실제 동작(0.18.0 src/scaffolder.mjs 확인):
          #   - 대상 파일이 이미 있으면 건너뛴다(preserve).
          #   - 예외로 항상 덮어쓰는 건 `scripts/**` 와 `llm-wiki/_meta/lint-rules.md`,
          #     `llm-wiki/_meta/freshness-policy.md` 세 갈래뿐이다.
          #   - 존재 판정은 fs.access 라 '심링크를 따라간다' → 끊긴 링크는 '없음'으로
          #     보고 링크를 통과해 쓴다(Snapshot 이 두 심링크를 모두 끊는 이유).
          #   - GEMINI.md 템플릿은 아예 없다 — 스캐폴더가 만들지 않는다.
          # 아래 checkout 은 그래서 대부분 무동작이지만, 스캐폴더가 보존 규칙을
          # 바꾸는 순간을 대비한 안전망으로 남긴다(비용 0).
          # pathspec 은 반드시 분리한다: 다중 pathspec 은 하나만 매치에 실패해도
          # 명령 전체가 무효가 되어 나머지 원복까지 같이 건너뛴다.

          # [1] repo/사람 소유 파일 — 모드와 무관하게 항상 원복한다. (G/H)
          #  - CLAUDE.md: 포인터로 덮어쓴 상태로 Claude 에 넘기면 "CLAUDE.md 고유
          #    지침을 AGENTS.md 로 병합" 지시가 원리적으로 수행 불가능해지고(볼
          #    내용이 없다), Snapshot 이 SUBSTANTIVE=false 로 읽어 변환 가드까지
          #    통과해 원본이 조용히 심링크로 대체된다. 첫 실행은 항상 full 이므로
          #    이 원복이 full 에서도 걸려 있어야 한다.
          #  - GEMINI.md: 프롬프트가 "건드리지 말라"고 명시한 건 사람이 쓴 내용이
          #    있을 수 있다는 전제다. Claude 는 안 건드려도 스캐폴더가 덮어쓴다.
          #  HEAD 에 해당 파일이 없으면 checkout 이 실패하고(|| true) 스캐폴더가
          #  새로 만든 포인터가 남는다 — 신규 생성 경로는 그대로 동작한다.
          git checkout -- CLAUDE.md 2>/dev/null || true
          git checkout -- GEMINI.md 2>/dev/null || true

          # [2] 파이프라인 소유 파일 — full 에서만 재생성, 그 외에는 HEAD 상태 유지.
          #  - checkout: 스캐폴더가 덮어쓴 추적 파일 원복 (재번역 방지)
          #  - clean   : [B] 스캐폴더가 새로 만든 untracked 영문 템플릿 제거.
          #              diff 범위 밖이라 Claude 가 번역하지 않고, skip 모드에선
          #              Claude 가 아예 실행되지 않아 boilerplate 가 그대로 커밋된다.
          #  결과적으로 템플릿/스키마 갱신은 full 실행으로만 반영된다 — 의도된 규칙.
          if [ "$MODE" != "full" ]; then
            git checkout -- "$DOCS_ROOT" 2>/dev/null || true
            git checkout -- AGENTS.md    2>/dev/null || true
            git clean -fdq "$DOCS_ROOT"  2>/dev/null || true
          fi

          # [3] .claude/ 와 scripts/ 는 도구 자산이므로 원복하지 않는다
          #     (핀된 버전 기준 최신을 그대로 받는다).
          #     그래서 핀을 올린 직후 첫 실행은 skip 모드여도 .claude/ 변경만으로
          #     PR 이 열릴 수 있다 — 의도된 동작이다.

      # Gemini CLI → Antigravity CLI 마이그레이션 (결정론적, LLM 무관).
      # 근거: https://antigravity.google/docs/cli/gcli-migration
      #  - 문서가 "수동 이동 필요"로 명시한 유일한 항목이 워크스페이스 스킬 경로다:
      #    .gemini/skills/ → .agents/skills/ (이동 전에는 인식되지 않는다)
      #  - GEMINI.md 자체는 변경 불필요: Antigravity CLI 가 AGENTS.md 와 동등하게
      #    계속 읽고, 파일명 변경·폐기 예정이 없다. 그래서 GEMINI.md 는 여전히
      #    Scaffold 단계에서 항상 원복되는 "repo/사람 소유" 파일로 둔다.
      #  - 전역 경로(~/.gemini/antigravity-cli/skills/, ~/.gemini/config/mcp_config.json)는
      #    개발자 로컬 머신 사안이라 이 워크플로우 범위 밖이다.
      # Claude 스텝보다 앞에 둔다: Claude 가 마이그레이션된 레이아웃을 보고 문서화해야 한다.
      - name: Migrate .gemini/skills to .agents/skills (Antigravity CLI)
        run: |
          set -euo pipefail

          if [ ! -d .gemini/skills ]; then
            echo ".gemini/skills 없음 — 이동할 것 없음 (이미 마이그레이션됨 또는 스킬 미사용)"
            exit 0
          fi
          if [ -e .agents/skills ]; then
            echo "::warning::.gemini/skills 와 .agents/skills 가 모두 존재합니다 — 자동 병합하지 않고 그대로 둡니다. 수동 확인이 필요합니다."
            exit 0
          fi

          mkdir -p .agents
          # 추적 중이면 git mv 로 이력을 보존하고(양쪽 변경이 곧바로 staged 된다),
          # untracked 면 일반 mv 를 쓴다.
          if git ls-files --error-unmatch .gemini/skills >/dev/null 2>&1; then
            git mv .gemini/skills .agents/skills
          else
            mv .gemini/skills .agents/skills
          fi
          echo ".gemini/skills → .agents/skills 이동 완료"

          # .gemini 에 다른 설정이 남아 있으면 건드리지 않는다(문서가 요구한 건 skills 뿐).
          if [ -d .gemini ] && [ -z "$(ls -A .gemini)" ]; then
            rmdir .gemini
            echo "빈 .gemini 디렉토리 제거"
          else
            echo ".gemini 에 다른 항목이 남아 있어 보존합니다: $(ls -A .gemini 2>/dev/null | tr '\n' ' ')"
          fi

      # Claude 에게는 '파이프라인 영역'만 보여준다.
      # diff 모드에서 AGENTS.md 는 HEAD 상태로 원복되는데, 그 안에는 사람 영역과
      # llm-wiki 마커 블록이 함께 있다. 마커 안쪽만 남겨서 넘기면 Claude 가 사람
      # 영역을 볼 일이 없고, 재조립 단계에서 사람 영역이 정확히 한 번만 붙는다.
      # (마커가 없으면 = 파이프라인이 처음 쓰는 경우이거나 legacy 실행 결과이므로
      #  파일 전체를 파이프라인 영역으로 취급한다)
      - name: Reduce AGENTS.md to pipeline region
        env:
          AGENTS_FILE: ${{ steps.snapshot.outputs.agents_file }}
          AGENTS_HUMAN: ${{ steps.snapshot.outputs.agents_human }}
        run: |
          set -euo pipefail
          SEED="$RUNNER_TEMP/AGENTS.seed.md"

          # diff 모드의 `git checkout -- AGENTS.md` 가 심링크를 되살렸을 수 있다.
          # Claude 가 편집할 대상은 항상 '실파일 AGENTS.md' 여야 한다.
          if [ -L AGENTS.md ]; then
            rm -f AGENTS.md
            echo "복원된 심링크를 다시 끊었습니다(재조립 단계에서 복구)"
          fi

          # Claude 에게 넘길 시드를 정한다. 규칙은 하나다:
          #   지난 실행의 llm-wiki 블록이 있으면 그것을, 없으면 스캐폴더 템플릿을 쓴다.
          if [ -s "$SEED" ]; then
            cp "$SEED" AGENTS.md
            echo "지난 llm-wiki 블록($(awk 'NF' "$SEED" | wc -l | tr -d ' ')줄)을 시드로 사용합니다"
          elif [ -f AGENTS.md ]; then
            echo "스캐폴더 템플릿($(awk 'NF' AGENTS.md | wc -l | tr -d ' ')줄)을 시드로 사용합니다"
            # 이 파일이 정말 스캐폴더 템플릿인지 확인한다. Snapshot 이 state=human
            # 원본을 치우므로 여기 남은 건 스캐폴더 산출물이어야 한다. 아니라면
            # 스캐폴더 동작이 바뀐 것이므로 조용히 지나가지 않고 드러낸다.
            if ! grep -q '이 파일은 라우팅 레이어다' AGENTS.md \
               && ! { grep -q '^## 4\. Routing' AGENTS.md && grep -q '^## 5\. Knowledge Index' AGENTS.md; }; then
              echo "::warning::시드에 스캐폴더 템플릿 서명이 없습니다 — 스캐폴더가 AGENTS.md 를 쓰지 않았을 수 있습니다. 산출된 라우팅 블록을 반드시 확인하세요."
            fi
          else
            : > AGENTS.md
            echo "::warning::시드가 없습니다 — 빈 AGENTS.md 로 시작합니다(라우팅이 비어 나올 수 있습니다)"
          fi

      # 빈 버킷 조사. diff 모드에서 '변경 파일 없음'과 '문서가 애초에 없음'은 전혀
      # 다른 상태인데, diff 범위만 보면 후자가 영구히 방치된다. 실측으로 13개 repo 중
      # 10개가 llm-wiki/biz-qa/ 를 통째로 빠뜨린 채 PR 이 나갔고 어떤 검사도 걸러내지
      # 못했다(docs-lint 의 applies-to-coverage 는 src/ 커버리지만 보고, src/ 가 없는
      # repo 에서는 규칙 자체가 조기 반환된다).
      # → 비어 있는 버킷을 세어 Claude 에게 "diff 범위와 무관하게 이번에 채워라"로
      #   넘긴다. full 모드에서는 어차피 전량 생성이므로 목록을 넘기지 않는다.
      - name: Audit empty buckets
        id: buckets
        if: steps.scope.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          EMPTY=""
          if [ -d "$DOCS_ROOT" ]; then
            for d in "$DOCS_ROOT"/*/; do
              [ -d "$d" ] || continue
              b=$(basename "$d")
              case "$b" in _meta) continue ;; esac   # _meta 는 스캐폴더·스크립트 소유
              # README.md 는 스캐폴더가 항상 놓으므로 atom 으로 세지 않는다.
              N=$(find "$d" -name '*.md' ! -name 'README.md' | grep -c '' || true)
              if [ "${N:-0}" -eq 0 ]; then EMPTY="${EMPTY:+$EMPTY, }$b"; fi
            done
          fi
          echo "empty_list=$EMPTY" >> "$GITHUB_OUTPUT"
          if [ -n "$EMPTY" ]; then
            echo "실행 전 빈 버킷: $EMPTY"
          else
            echo "실행 전 빈 버킷 없음"
          fi

      # Claude only writes files here — no git/gh write commands.
      - name: Generate docs content (Claude, file-writing only)
        if: steps.scope.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 240   # gigs-frontend(소형 프론트) 가 54분. 70MB 급 모노리스는 4단계 파이프라인에 훨씬 오래 걸린다
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # 생성 규칙은 스킬이 정본이다 — 이 프롬프트에 복제하지 않는다.
          # 출력 경로, 한국어 작성 규칙, 프론트매터 스키마, owner 산출 방식은 모두
          # .claude/skills/llm-wiki/SKILL.md 에 정의돼 있다(Output contract /
          # Output language / Draft template / owners-from-git.mjs).
          # 과거에 owner 규칙을 여기서 중복 지시했다가, Claude 가 email → GitHub
          # handle 변환을 위해 allowlist 밖의 `gh api` 를 호출해 승인 대기로
          # 정지(비대화형이라 승인 불가)하는 실패를 겪었다.
          prompt: |
            ${{ steps.scope.outputs.mode == 'full' && 'llm-wiki 파이프라인을 실행해 주세요. (SKILL-PIPELINE) 최대한 자세하게 작성해 주세요.' || format('지난 llm-wiki 갱신 커밋({0}) 이후 변경된 소스 파일은 다음과 같습니다: {1}. 이 변경에 영향받는 atom만 갱신해 주세요. 범위 판단은 이미 끝났으니 git log로 다시 탐색하지 마시고, 필요하면 git diff/git show로 개별 파일의 변경 내용만 확인해 주세요. 영향받는 atom이 없다고 판단되면 파일을 수정하지 말고 그 사실만 알려주세요.', steps.scope.outputs.base, steps.scope.outputs.changed_list) }}

            생성 규칙(출력 경로, 작성 언어, 프론트매터 스키마, owner 산출)은
            .claude/skills/llm-wiki/SKILL.md 의 계약을 그대로 따라 주세요.
            아래는 이 워크플로우에서만 추가로 요구하는 사항입니다.

            CLAUDE.md 와 GEMINI.md 는 건드리지 말아 주세요 — 삭제·수정·심볼릭 링크
            변환 모두 하지 말아 주세요. 이후 별도 자동화 스텝이 결정론적으로 처리합니다.

            AGENTS.md 는 라우팅 레이어로만 작성해 주세요(SKILL.md 계약대로). 지금
            보이는 AGENTS.md 는 파이프라인이 관리하는 영역만 떼어낸 것이며, 사람이
            작성한 영역은 이 스텝이 끝난 뒤 자동으로 복원됩니다. 그러니 사람 영역을
            복원하거나 보존하려고 시도하지 말고, 라우팅·인덱스 작성에만 집중해 주세요.

            중요: git add, git commit, git push, gh pr create 등 어떤 git/gh
            쓰기 명령도 실행하지 말아 주세요. 파일 시스템에 변경사항을 작성하는
            것까지만 진행해 주세요. 커밋과 PR 생성은 이후 워크플로우 스텝이
            자동으로 처리합니다.

            SKILL-PIPELINE 의 Phase 3a(BIZ-QA)는 서브에이전트로 띄우지 말고 메인
            세션에서 순차로 직접 수행해 주세요 — SKILL-BIZ-QA.md 를 Read 하고 그
            절차를 그대로 따라 주세요. 이 실행 환경에는 Agent 도구가 없고, 설령
            있어도 백그라운드 에이전트는 이 스텝이 끝나는 시점에 완료가 보장되지
            않습니다. Phase 3b(owners-from-git.mjs)는 수 초면 끝나므로 3a 를
            순차로 돌려도 전체 소요는 거의 같습니다.
            ${{ steps.buckets.outputs.empty_list != '' && format('

            아래 버킷은 지금 문서가 하나도 없습니다: {0}. diff 범위와 무관하게 이번
            실행에서 채워 주세요 — 변경된 파일이 없다는 것과 문서가 애초에 없다는
            것은 다른 상태이고, 후자는 지금 채우지 않으면 계속 비어 있게 됩니다.
            해당 버킷의 성격상 이 저장소에 쓸 내용이 정말 없다고 판단되면, 그
            판단과 근거를 알려 주세요(빈 채로 두어도 됩니다).', steps.buckets.outputs.empty_list) || '' }}
          # allowlist 설계:
          #  - find 는 -exec/-delete 로 임의 명령 실행이 가능해 allowlist 를 무력화한다 → 제외
          #  - node 도 `node -e '...'` 가 임의 코드 실행이므로 스크립트 경로까지 좁힌다.
          #    SKILL.md Step 6(docs-lint exit 0 루프)과 SKILL-PIPELINE Phase 3b
          #    (owners-from-git.mjs)는 이 두 항목 없이는 실행 자체가 불가능하다.
          #  - gh 는 넣지 않는다. 필요해지는 유일한 이유였던 owner handle 조회를
          #    스킬(owners-from-git.mjs)에 맡겼고, `gh api -X POST` 로 쓰기가 되므로
          #    "Claude 는 파일만 쓴다"는 이 파이프라인의 전제를 깬다.
          #  - git 계열은 읽기 전용 서브커맨드만 허용한다.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(rg:*),Bash(grep:*),Bash(node scripts/docs-lint.mjs:*),Bash(node scripts/owners-from-git.mjs:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git shortlog:*)"

      # 끊긴 인라인 링크 수리. Claude 는 '쓸 예정이었던' 형제 atom 을 본문에서
      # 참조해두고 실제로는 만들지 않는다(실측: laas-airflow 에서 6건 → docs-lint
      # broken-link 는 ERROR 라 1h23m 산출물이 PR 없이 버려졌다).
      #
      # 판정 근거는 docs-lint 자신이다(`--json`). 링크 해석 로직을 재구현하면
      # lint 와 어긋날 수 있으므로 lint 가 실제로 문제라고 한 것만 손댄다.
      # 수리 규칙은 사람 리뷰어가 할 일과 같은 순서다:
      #   1) 같은 파일명이 트리 안에 하나만 있으면 → 경로를 그쪽으로 고친다
      #   2) 도메인 디렉토리 이름과 일치하면    → 그 디렉토리의 overview.md 로 고친다
      #   3) 어디에도 없으면                    → 링크만 벗긴다(문장은 남긴다)
      # 3번은 정보를 지우는 게 아니라 '없는 문서를 가리키는 링크'를 없애는 것이고,
      # 무엇을 벗겼는지 PR 본문에 전부 적어 리뷰어가 문서를 채우거나 다시 이을 수 있게 한다.
      # Reassemble '앞'에 둔다 — orphan 백필이 수리된 링크 그래프를 보고 판단해야 한다.
      - name: Repair broken links in atoms
        id: linkfix
        if: steps.scope.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          # stdin ESM 은 노드 버전에 따라 감지 방식이 달라 신뢰하지 않는다 —
          # .mjs 파일로 떨어뜨려 실행한다(실패 시 아티팩트로 원본을 볼 수 있다).
          cat > "$RUNNER_TEMP/linkfix.mjs" <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const ROOT = process.env.DOCS_ROOT || 'llm-wiki';

          // docs-lint 를 판정자로 쓴다. 에러가 있어도 exit 1 이므로 status 는 무시하고
          // stdout 만 읽는다(파싱 실패 시엔 수리를 포기하고 조용히 넘어간다 — 그러면
          // 뒤의 Verify 가 원래대로 실패해서 문제가 감춰지지 않는다).
          let report;
          try {
            const out = execFileSync('node', ['scripts/docs-lint.mjs', '--json'],
                                     { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] });
            report = JSON.parse(out);
          } catch (e) {
            const out = e.stdout;
            if (!out) { console.log('docs-lint --json 을 읽지 못해 링크 수리를 건너뜁니다'); process.exit(0); }
            try { report = JSON.parse(out); }
            catch { console.log('docs-lint --json 파싱 실패 — 링크 수리를 건너뜁니다'); process.exit(0); }
          }

          const broken = (report.errors || []).filter((e) => e.rule === 'broken-link');
          if (broken.length === 0) { console.log('끊긴 링크 없음'); process.exit(0); }

          // 트리 인덱스: basename → 경로 목록, 디렉토리명 → 경로
          const files = [], dirs = new Map();
          async function walk(d) {
            for (const e of await fs.readdir(d, { withFileTypes: true })) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) { dirs.set(e.name, p); await walk(p); }
              else if (e.isFile() && e.name.endsWith('.md')) files.push(p);
            }
          }
          await walk(ROOT);
          const byBase = new Map();
          for (const f of files) {
            const b = path.basename(f);
            byBase.set(b, [...(byBase.get(b) || []), f]);
          }

          const relinked = [], delinked = [], droppedRelated = [];

          for (const [file, items] of Object.entries(
                 broken.reduce((a, e) => ((a[e.file] ||= []).push(e), a), {}))) {
            let text = await fs.readFile(file, 'utf8');
            const before = text;

            for (const it of items) {
              // related: 항목은 링크를 벗길 수 없으니 그 줄을 걷어낸다
              const mRel = it.msg.match(/^related: (.+) not found$/);
              if (mRel) {
                const target = mRel[1];
                const re = new RegExp('^[ \\t]*-[ \\t]*' + target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[ \\t]*\\r?\\n', 'm');
                if (re.test(text)) { text = text.replace(re, ''); droppedRelated.push(`${file} → ${target}`); }
                continue;
              }

              const mIn = it.msg.match(/^inline link not found: (.+)$/);
              if (!mIn) continue;
              const link = mIn[1];
              const base = path.basename(link.split('#')[0]);

              // (1) 같은 파일명이 트리에 정확히 하나
              let fixed = null;
              const cand = byBase.get(base);
              if (cand && cand.length === 1) fixed = cand[0];

              // (2) 도메인 디렉토리 이름과 일치 → overview.md
              if (!fixed) {
                const d = dirs.get(base.replace(/\.md$/, ''));
                if (d) {
                  const ov = path.join(d, 'overview.md');
                  if (files.includes(ov)) fixed = ov;
                }
              }

              const esc = link.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              if (fixed) {
                let relp = path.relative(path.dirname(file), fixed);
                if (!relp.startsWith('.')) relp = './' + relp;
                text = text.replace(new RegExp('\\(' + esc + '\\)', 'g'), '(' + relp + ')');
                relinked.push(`${file}: ${link} → ${relp}`);
              } else {
                // [텍스트](끊긴링크) → 텍스트
                text = text.replace(new RegExp('\\[([^\\]]*)\\]\\(' + esc + '\\)', 'g'), '$1');
                delinked.push(`${file}: ${link}`);
              }
            }

            if (text !== before) await fs.writeFile(file, text, 'utf8');
          }

          for (const r of relinked)       console.log(`  경로 수정: ${r}`);
          for (const d of delinked)       console.log(`  링크 벗김: ${d}`);
          for (const d of droppedRelated) console.log(`  related 제거: ${d}`);
          console.log(`relinked=${relinked.length} delinked=${delinked.length} related_dropped=${droppedRelated.length}`);

          await fs.appendFile(process.env.GITHUB_OUTPUT,
            `relinked=${relinked.length}\ndelinked=${delinked.length}\nrelated_dropped=${droppedRelated.length}\n`);
          if (delinked.length) {
            console.log(`::warning::존재하지 않는 문서를 가리키던 인라인 링크 ${delinked.length}건에서 링크를 벗겼습니다 — 해당 문서를 작성하거나 참조를 다시 이어 주세요.`);
            await fs.writeFile(process.env.RUNNER_TEMP + '/delinked.txt', delinked.join('\n') + '\n');
          }
          NODE
          node "$RUNNER_TEMP/linkfix.mjs"

          # 실행 후 빈 버킷 재조사. 여기서도 비어 있으면 Claude 가 채우지 않았다는
          # 뜻이므로(정당한 판단일 수도 있다) 리뷰어에게 그대로 넘긴다.
          EMPTY_AFTER=""
          if [ -d "$DOCS_ROOT" ]; then
            for d in "$DOCS_ROOT"/*/; do
              [ -d "$d" ] || continue
              b=$(basename "$d")
              case "$b" in _meta) continue ;; esac
              N=$(find "$d" -name '*.md' ! -name 'README.md' | grep -c '' || true)
              if [ "${N:-0}" -eq 0 ]; then EMPTY_AFTER="${EMPTY_AFTER:+$EMPTY_AFTER, }$b"; fi
            done
          fi
          echo "empty_after=$EMPTY_AFTER" >> "$GITHUB_OUTPUT"
          if [ -n "$EMPTY_AFTER" ]; then
            echo "::warning::문서가 하나도 없는 버킷이 남았습니다: ${EMPTY_AFTER} — 해당 저장소에 쓸 내용이 없어서인지, 생성이 누락된 것인지 확인해 주세요."
          else
            echo "빈 버킷 없음"
          fi

      # 결정론적 재조립. Claude 가 쓴 AGENTS.md 를 마커로 감싸고, 그 위에 보관해둔
      # 사람 영역을 그대로 복원한다. 마커 밖은 파이프라인이 절대 건드리지 않으므로
      # 사람 작성 내용의 유실이 코드 구조상 불가능하다.
      - name: Reassemble AGENTS.md (사람 영역 + llm-wiki 블록)
        id: reassemble
        env:
          AGENTS_FILE: ${{ steps.snapshot.outputs.agents_file }}
          AGENTS_LINK_TARGET: ${{ steps.snapshot.outputs.agents_link_target }}
        run: |
          set -euo pipefail
          HUMAN="$RUNNER_TEMP/AGENTS.human.md"
          F="${AGENTS_FILE:-AGENTS.md}"     # 최종 내용 파일 (심링크 repo 면 링크 대상)
          if [ ! -f AGENTS.md ]; then
            echo "::warning::AGENTS.md 가 없습니다 — 재조립을 건너뜁니다(docs-lint 가 잡을 것입니다)"
            exit 0
          fi

          # Claude 가 편집한 AGENTS.md 가 파이프라인 영역이다. 마커가 남았다면 제거한다.
          sed -e '/<!-- BEGIN: llm-wiki/d' -e '/<!-- END: llm-wiki/d' AGENTS.md > "$RUNNER_TEMP/AGENTS.pipe.md"

          # ── orphan atom 백필 ────────────────────────────────────────────────
          # docs-lint --strict 는 warn 도 실패로 취급하고, orphan-doc 은 "어디서도
          # 링크되지 않은 atom"을 warn 한다. SKILL-PIPELINE 은 Phase 1 이 §5 인덱스를
          # 완성한 뒤 Phase 3a(BIZ-QA)가 atom 을 더 만들기 때문에 그 atom 들이
          # 인덱스에 편입되지 않는다(실측: calendar-api 에서 biz-qa 5건 orphan → 실패).
          # 링크가 인정되는 곳은 AGENTS.md 백틱 참조 / atom 의 related: / atom 본문
          # 마크다운 링크 세 군데다. 그중 첫 번째를 결정론적으로 채운다.
          # ⚠ 이 블록은 '보조 기능'이다. 실패해도 스텝을 죽이면 안 된다.
          #   grep 은 매치가 0건이면 exit 1 을 반환하고, pipefail + set -e 조합에서는
          #   그것만으로 스텝이 죽는다(실측: calendar-api 에서 출력 한 줄 없이 exit 1).
          #   그래서 이 구간에서만 errexit/pipefail 을 끈다.
          set +e +o pipefail
          if [ -d "$DOCS_ROOT" ]; then
            {
              grep -ohE '`'"$DOCS_ROOT"'/[^`[:space:]]+\.md`' "$RUNNER_TEMP/AGENTS.pipe.md" 2>/dev/null | tr -d '`'
              grep -rhoE '\('"$DOCS_ROOT"'/[^)[:space:]]+\.md\)' "$DOCS_ROOT" 2>/dev/null | tr -d '()'
              grep -rhoE '^[[:space:]]*-[[:space:]]+'"$DOCS_ROOT"'/[^[:space:]]+\.md' "$DOCS_ROOT" 2>/dev/null \
                | sed 's/^[[:space:]]*-[[:space:]]*//'
            } | sort -u > "$RUNNER_TEMP/linked.txt"
            find "$DOCS_ROOT" -name '*.md' ! -name 'README.md' | sort > "$RUNNER_TEMP/all-atoms.txt"
            comm -23 "$RUNNER_TEMP/all-atoms.txt" "$RUNNER_TEMP/linked.txt" > "$RUNNER_TEMP/orphans.txt"
            ORPHANS=$(awk 'NF' "$RUNNER_TEMP/orphans.txt" | wc -l | tr -d ' ')
            if [ "${ORPHANS:-0}" -gt 0 ]; then
              {
                echo
                echo '### 미분류 (자동 링크 — 인덱스 편입 필요)'
                echo
                echo '> 아래 atom 은 어느 인덱스에서도 참조되지 않아 파이프라인이 자동으로 링크했습니다.'
                echo '> 적절한 버킷 섹션으로 옮겨 주세요.'
                echo
                while IFS= read -r a; do [ -n "$a" ] && echo "- \`${a}\`"; done < "$RUNNER_TEMP/orphans.txt"
              } >> "$RUNNER_TEMP/AGENTS.pipe.md"
              echo "::warning::인덱스에서 누락된 atom ${ORPHANS}건을 '미분류' 섹션으로 자동 링크했습니다 — 적절한 버킷으로 옮겨 주세요."
              sed 's/^/  orphan: /' "$RUNNER_TEMP/orphans.txt"
            else
              echo "orphan atom 없음"
            fi
          fi
          set -e -o pipefail   # 보조 블록 종료 — 이후는 다시 엄격 모드

          {
            if [ -s "$HUMAN" ]; then cat "$HUMAN"; echo; fi
            echo '<!-- BEGIN: llm-wiki (자동 생성 — 이 블록만 파이프라인이 갱신합니다. 위쪽 내용은 건드리지 않습니다) -->'
            cat "$RUNNER_TEMP/AGENTS.pipe.md"
            echo '<!-- END: llm-wiki -->'
          } > "$F"

          # 심링크 repo 면 원래 구조를 복원한다: AGENTS.md → 내용 파일
          if [ -n "${AGENTS_LINK_TARGET:-}" ] && [ "$F" != "AGENTS.md" ]; then
            rm -f AGENTS.md
            ln -s "$AGENTS_LINK_TARGET" AGENTS.md
            echo "심링크 복원: AGENTS.md → $AGENTS_LINK_TARGET"
          fi

          if [ -s "$HUMAN" ]; then
            echo "$F: 사람 영역 $(awk 'NF' "$HUMAN" | wc -l | tr -d ' ')줄 복원 + llm-wiki 블록 삽입"
          else
            echo "$F: 사람 영역 없음 — llm-wiki 블록만 기록"
          fi

          # llm-wiki 블록이 사실상 비어 있으면 경고한다. AGENTS.md 는 llm-wiki/ 트리의
          # 단일 진입점이므로 라우팅·인덱스가 없으면 atom 을 몇 개 만들었든 쓸모가 없다.
          # docs-lint 는 이걸 잡지 못한다(orphan-doc 은 atom 끼리의 링크로도 충족됨).
          BLOCK=$(sed -n '/<!-- BEGIN: llm-wiki/,/<!-- END: llm-wiki/p' "$F" \
                  | sed -e '/<!-- BEGIN: llm-wiki/d' -e '/<!-- END: llm-wiki/d' \
                  | awk 'NF' | wc -l | tr -d ' ')
          echo "agents_block_lines=${BLOCK:-0}" >> "$GITHUB_OUTPUT"
          if [ "${BLOCK:-0}" -lt 5 ]; then
            echo "::warning::llm-wiki 블록이 ${BLOCK:-0}줄뿐입니다 — 라우팅/인덱스가 비어 있습니다. AGENTS.md 진입점 역할을 확인하세요."
          else
            echo "llm-wiki 블록 ${BLOCK}줄"
          fi

          # 구 산출 경로(docs/) 잔존 참조 검사.
          # 0.18 에서 산출 루트가 docs/ → llm-wiki/ 로 바뀌었다. 예전 워크플로우로
          # 한 번 돌린 repo 는 AGENTS.md 가 docs/ 를 참조하는 라우팅 문서이고,
          # 그게 SEED 로 Claude 에게 넘어간다(state=pipeline). Claude 가 경로를
          # 갈아쓰지 않으면 새 인덱스가 '구 트리'를 가리키는데, 그 파일들은 실제로
          # 존재하므로 docs-lint 의 broken-ref 가 잡지 못한다 — 조용히 통과한다.
          # 그래서 여기서 세서 드러낸다. 판정이 아니라 관측이므로 경고만 한다.
          STALE=0
          if [ "$DOCS_ROOT" != docs ]; then
            STALE=$(grep -ohE '`docs/[^`[:space:]]+\.md`' "$RUNNER_TEMP/AGENTS.pipe.md" 2>/dev/null | wc -l | tr -d ' ' || true)
          fi
          echo "stale_root_refs=${STALE:-0}" >> "$GITHUB_OUTPUT"
          if [ "${STALE:-0}" -gt 0 ]; then
            echo "::warning::llm-wiki 블록이 구 경로 docs/ 를 ${STALE}회 참조합니다 — 산출 루트는 ${DOCS_ROOT}/ 입니다. 인덱스가 예전 트리를 가리키고 있는지 확인하세요."
          fi

      # CLAUDE.md 처리. 원칙에 따라 실내용이 있으면 심링크로 바꾸지 않는다.
      #   absent / pointer  → AGENTS.md 를 가리키는 심링크 (기존 동작)
      #   symlink           → 그대로
      #   human             → 원본 유지 + 포인터 블록만 마커로 갱신/추가
      - name: Handle CLAUDE.md (symlink or pointer block)
        env:
          CLAUDE_KIND: ${{ steps.snapshot.outputs.claude_kind }}
          CLAUDE_LINK_TARGET: ${{ steps.snapshot.outputs.claude_link_target }}
        run: |
          set -euo pipefail
          case "$CLAUDE_KIND" in
            agents_target)
              echo "CLAUDE.md 가 AGENTS.md 심링크의 대상입니다 — llm-wiki 블록이 이미 이 파일에 들어갔으므로 추가 작업 없음" ;;
            symlink)
              # Snapshot 이 스캐폴딩 전에 링크를 끊었다. 보통은 스캐폴드 직후의
              # `git checkout -- CLAUDE.md` 가 되살리지만, 추적되지 않는 링크였다면
              # 그 checkout 이 실패한다 — 그 경우까지 여기서 확실히 복원한다.
              if [ -L CLAUDE.md ]; then
                echo "이미 심링크 — 변경 없음"
              elif [ -n "${CLAUDE_LINK_TARGET:-}" ]; then
                rm -f CLAUDE.md
                ln -s "$CLAUDE_LINK_TARGET" CLAUDE.md
                echo "CLAUDE.md 심링크 복원 → $CLAUDE_LINK_TARGET"
              else
                echo "::warning::CLAUDE.md 가 심링크였는데 타깃을 알 수 없어 복원하지 못했습니다."
              fi ;;
            absent|pointer)
              if [ ! -f AGENTS.md ]; then
                echo "AGENTS.md 가 없어 심링크를 만들지 않습니다"; exit 0
              fi
              rm -f CLAUDE.md
              ln -s AGENTS.md CLAUDE.md
              echo "CLAUDE.md → AGENTS.md 심링크 (kind=$CLAUDE_KIND)" ;;
            human)
              sed -e '/<!-- BEGIN: llm-wiki/,/<!-- END: llm-wiki/d' CLAUDE.md > "$RUNNER_TEMP/CLAUDE.body.md"
              {
                cat "$RUNNER_TEMP/CLAUDE.body.md"
                echo
                echo '<!-- BEGIN: llm-wiki (자동 생성 — 이 블록만 파이프라인이 갱신합니다) -->'
                echo '## llm-wiki 지식 베이스'
                echo
                echo '이 저장소의 코드 지식은 `AGENTS.md` 의 llm-wiki 블록과 `llm-wiki/` 트리에 있습니다.'
                echo '작업 전에 `AGENTS.md` 를 먼저 읽어 주세요.'
                echo '<!-- END: llm-wiki -->'
              } > CLAUDE.md
              echo "실내용 보존 + 포인터 블록 갱신 (심링크 변환하지 않음)" ;;
          esac

      # Independent verification — not Claude's self-report.
      # skip 모드에서도 항상 돌린다: 기존 문서 트리가 깨져 있다면 그것도 드러나야 한다.
      # (무관한 red run 이 소음이 되면 if: steps.scope.outputs.mode != 'skip' 추가)
      - name: Verify docs-lint --strict
        run: node scripts/docs-lint.mjs --strict

      - name: Commit and push changes
        id: commit
        env:
          # push 는 checkout 의 http.extraheader 로 인증되므로 GH_TOKEN 이 필요 없다.
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 인증은 actions/checkout 이 심어둔 http.extraheader 를 그대로 쓴다.
          # (커스텀 credential helper 로 대체하려던 시도는 Claude 스텝 이후 403 으로
          #  실패했다 — checkout 블록 주석 참조. 여기서 인증 설정을 만지지 말 것.)
          # 인증 실패 시 1차 단서로 auth 관련 config 를 남긴다(값은 마스킹).
          echo "--- git config (auth 관련, redacted) ---"
          git config --local --list --show-origin \
            | grep -Ei 'credential|extraheader|insteadof|remote\..*\.url' \
            | sed -E -e 's/(extraheader=).*/\1***/' -e 's#://[^@/]*@#://***@#' \
            || echo "(none)"

          BRANCH="$DOCS_BRANCH"

          # [A] checkout(fetch-depth: 0)이 refs/remotes/origin/* 을 이미 모두 가져왔으므로
          #     추가 fetch 없이 존재 여부만 확인한다. fetch 실패가 "사람 커밋 보호" 가드를
          #     조용히 끈 채로 force push 가 진행되는 경로를 구조적으로 제거한다.
          if git rev-parse --verify --quiet "refs/remotes/origin/${BRANCH}" >/dev/null; then
            HUMAN=$(git log --format='%ae' "origin/${BASE_BRANCH}..origin/${BRANCH}" \
                    | grep -v 'github-actions\[bot\]@users.noreply.github.com' | head -1 || true)
            if [ -n "$HUMAN" ]; then
              BRANCH="${DOCS_BRANCH}-${GITHUB_RUN_ID}"
              echo "::notice::기존 브랜치에 사람 커밋($HUMAN)이 있어 ${BRANCH} 로 분기합니다."
            fi
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # -B 는 필수다. self-hosted 러너는 워크스페이스를 재사용하고,
          # actions/checkout 의 기본 clean:true 는 워킹트리만 정리하고
          # 로컬 브랜치는 남긴다 → -b 는 두 번째 실행부터 항상 실패한다.
          git checkout -B "$BRANCH"

          # add 대상은 두 가지를 통과해야 한다:
          #  (1) 존재해야 한다 — 없는 경로를 pathspec 으로 주면 git add 가 exit 128
          #  (2) .gitignore 대상이 아니어야 한다 — 무시된 pathspec 만 주면 exit 1 로 죽는다
          #      (gigs-frontend 는 .claude 를 ignore 한다. 실측으로 54분 산출물을 날렸다)
          # 강제 추가(-f)는 하지 않는다. repo 가 명시적으로 ignore 한 경로를
          # 파이프라인이 거슬러 커밋할 이유가 없다 — 스킬 자산은 매 실행 재스캐폴딩된다.
          # .agents: Antigravity CLI 워크스페이스 자산(.agents/skills, mcp_config.json).
          for p in "$DOCS_ROOT" .claude .agents AGENTS.md CLAUDE.md GEMINI.md; do
            if [ ! -e "$p" ] && [ ! -L "$p" ]; then continue; fi
            if git check-ignore -q "$p"; then
              echo "::notice::${p} 는 .gitignore 대상이라 커밋에서 제외합니다."
              continue
            fi
            git add -A -- "$p"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)   # 러너 TZ(UTC)로 하루 어긋나는 것 방지
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"

          git commit -m "docs(llm-wiki): ${DOCS_ROOT}/ 지식 베이스 갱신 (${MODE}, ${TODAY})"

          # [F] 원격에 없는 브랜치(run 단위 분기)는 force 가 불필요하고,
          #     --force-with-lease 는 remote-tracking ref 가 없으면 stale info 로 거부될 수 있다.
          if git rev-parse --verify --quiet "refs/remotes/origin/${BRANCH}" >/dev/null; then
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

      - name: Create or update Pull Request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          PR_TITLE: "docs(llm-wiki): ${{ env.DOCS_ROOT }}/ 지식 베이스 갱신 (${{ steps.scope.outputs.mode }}, ${{ steps.commit.outputs.date }})"
          AGENTS_HUMAN: ${{ steps.snapshot.outputs.agents_human }}
          CLAUDE_KIND: ${{ steps.snapshot.outputs.claude_kind }}
          BLOCK_LINES: ${{ steps.reassemble.outputs.agents_block_lines }}
          STALE_REFS: ${{ steps.reassemble.outputs.stale_root_refs }}
          DELINKED: ${{ steps.linkfix.outputs.delinked }}
          RELINKED: ${{ steps.linkfix.outputs.relinked }}
          EMPTY_BUCKETS: ${{ steps.linkfix.outputs.empty_after }}
          RUN_MODE: ${{ steps.scope.outputs.mode }}
          RUN_REASON: ${{ steps.scope.outputs.reason }}
          RUN_DATE: ${{ steps.commit.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # PR 본문은 파일로 만든다(YAML 블록 스칼라 안에서 열 0 으로 시작하는 줄을
          # 쓸 수 없으므로 문자열 조립은 쓰지 않는다).
          # 기존 사람 작성 파일을 건드린 경우에만 경고 블록을 최상단에 붙인다 —
          # 경고가 있으면 사람 파일을 수정했다는 신호이고, 없으면 신규 생성뿐이다.
          BODY="$RUNNER_TEMP/pr-body.md"
          : > "$BODY"

          if [ "$AGENTS_HUMAN" = "true" ] || [ "$CLAUDE_KIND" = "human" ]; then
            printf '> [!IMPORTANT]\n' >> "$BODY"
            printf '> **기존 파일을 수정했습니다 — 아래 파일은 세밀히 확인해 주세요**\n>\n' >> "$BODY"
            if [ "$AGENTS_HUMAN" = "true" ]; then
              printf '> - `AGENTS.md` — 기존 내용을 그대로 두고 아래에 llm-wiki 블록을 덧붙였습니다.\n' >> "$BODY"
              printf '>   마커(`<!-- BEGIN: llm-wiki -->`) **밖의 내용은 변경하지 않았습니다.**\n' >> "$BODY"
            fi
            if [ "$CLAUDE_KIND" = "human" ]; then
              printf '> - `CLAUDE.md` — 실질 내용이 있어 **심볼릭 링크로 바꾸지 않았습니다.**\n' >> "$BODY"
              printf '>   원본을 유지하고 AGENTS.md 를 가리키는 포인터 블록만 덧붙였습니다.\n' >> "$BODY"
            fi
            printf '\n' >> "$BODY"
          fi

          # llm-wiki 블록이 비면 atom 을 몇 개 만들었든 진입점이 없다.
          # docs-lint 가 잡지 못하는 품질 문제라 PR 에 명시한다(실측으로 겪음).
          if [ -n "${BLOCK_LINES:-}" ] && [ "${BLOCK_LINES}" -lt 5 ] 2>/dev/null; then
            printf '> [!WARNING]\n' >> "$BODY"
            printf '> `AGENTS.md` 의 llm-wiki 블록이 %s줄뿐입니다 — 라우팅/지식 인덱스가 비어 있습니다.\n' "$BLOCK_LINES" >> "$BODY"
            printf '> atom 은 생성됐지만 진입점이 없으므로 머지 전 확인이 필요합니다.\n\n' >> "$BODY"
          fi

          # 없는 문서를 가리키던 링크를 벗긴 건. lint 는 이제 통과하지만 '쓰여야 했는데
          # 안 쓰인 문서'가 남아 있다는 신호이므로 리뷰어에게 목록을 그대로 넘긴다.
          if [ -n "${DELINKED:-}" ] && [ "${DELINKED}" -gt 0 ] 2>/dev/null; then
            printf '> [!WARNING]\n' >> "$BODY"
            printf '> 존재하지 않는 문서를 가리키던 인라인 링크 %s건에서 **링크를 벗겼습니다**(문장은 유지).\n' "$DELINKED" >> "$BODY"
            printf '> 아래 문서를 작성하거나 참조를 다시 이어 주세요.\n>\n' >> "$BODY"
            if [ -f "$RUNNER_TEMP/delinked.txt" ]; then
              head -20 "$RUNNER_TEMP/delinked.txt" | sed 's/^/> - `/; s/$/`/' >> "$BODY"
              if [ "$(grep -c '' "$RUNNER_TEMP/delinked.txt")" -gt 20 ]; then
                printf '> - … 외 %s건 (실행 로그 참조)\n' "$(( $(grep -c '' "$RUNNER_TEMP/delinked.txt") - 20 ))" >> "$BODY"
              fi
            fi
            printf '\n' >> "$BODY"
          fi

          # 문서가 하나도 없는 버킷. docs-lint 가 구조적으로 잡지 못하는 누락이고,
          # 실측으로 13개 repo 중 10개가 biz-qa 를 통째로 빠뜨린 채 머지 대기까지 갔다.
          if [ -n "${EMPTY_BUCKETS:-}" ]; then
            printf '> [!WARNING]\n' >> "$BODY"
            printf '> 문서가 하나도 없는 버킷이 있습니다: `%s`\n' "$EMPTY_BUCKETS" >> "$BODY"
            printf '> 이 저장소에 쓸 내용이 없어서인지, 생성이 누락된 것인지 확인해 주세요.\n\n' >> "$BODY"
          fi

          # 구 산출 경로 잔존 참조. broken-ref 는 파일이 실제로 있으면 통과하므로
          # docs-lint 로는 드러나지 않는다 — PR 에 명시해야 리뷰어가 본다.
          if [ -n "${STALE_REFS:-}" ] && [ "${STALE_REFS}" -gt 0 ] 2>/dev/null; then
            printf '> [!WARNING]\n' >> "$BODY"
            printf '> `AGENTS.md` 의 llm-wiki 블록이 구 경로 `docs/` 를 %s회 참조합니다.\n' "$STALE_REFS" >> "$BODY"
            printf '> 이 저장소의 산출 루트는 `%s/` 입니다 — 인덱스가 예전 트리를 가리키는지 확인해 주세요.\n\n' "$DOCS_ROOT" >> "$BODY"
          fi

          {
            printf 'llm-wiki 파이프라인으로 자동 생성된 문서입니다.\n\n'
            printf -- '- 마지막 갱신: %s\n' "$RUN_DATE"
            printf -- '- 실행 모드: `%s` (%s)\n' "$RUN_MODE" "$RUN_REASON"
            printf -- '- `docs-lint --strict` 통과 확인됨\n'
            printf -- '- 워크플로우 실행: %s\n' "$RUN_URL"
            printf '\n자동 머지되지 않습니다 — 리뷰 후 직접 머지해주세요.\n'
            if [ -n "${RELINKED:-}" ] && [ "${RELINKED}" -gt 0 ] 2>/dev/null; then
              printf -- '- 끊긴 링크 %s건은 올바른 경로로 자동 수정됨\n' "$RELINKED"
            fi
          } >> "$BODY"
          # `create || edit` 형태는 권한/조직설정 실패까지 삼키므로 먼저 조회해 분기한다.
          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          # PR 생성/갱신은 `gh pr create|edit` 이 아니라 REST 로 한다.
          # `gh pr edit` 은 내부 GraphQL 쿼리에 Projects(classic) 의
          # `repository.pullRequest.projectCards` 를 포함하는데, GitHub 이 그 필드를
          # sunset 하면서 조회 자체가 에러가 되어 gh 가 exit 1 로 죽는다
          # (실측: laas-airflow, 1h13m 산출물이 push 까지 끝난 뒤 PR 스텝만 실패).
          # REST 는 그 필드를 건드리지 않으므로 이 계열 파손이 구조적으로 없다.
          # 본문에 백틱·따옴표·개행이 섞이므로 JSON 은 node 로 만든다(문자열 이스케이프).
          BODY_FILE="$BODY" OUT="$RUNNER_TEMP/pr.json" NEW=$([ -n "$PR_NUM" ] && echo 0 || echo 1) \
          node -e "
            const fs = require('fs');
            const o = { title: process.env.PR_TITLE, body: fs.readFileSync(process.env.BODY_FILE, 'utf8') };
            if (process.env.NEW === '1') { o.head = process.env.BRANCH; o.base = process.env.BASE_BRANCH; }
            fs.writeFileSync(process.env.OUT, JSON.stringify(o));
          "

          if [ -n "$PR_NUM" ]; then
            URL=$(gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}" \
                    --input "$RUNNER_TEMP/pr.json" --jq '.html_url')
            echo "PR 갱신: $URL"
          else
            # 조직/repo 설정의 "Allow GitHub Actions to create and approve pull requests"가
            # 꺼져 있으면 GITHUB_TOKEN 으로는 여기서 실패한다 (배포 전 확인 필요).
            URL=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
                    --input "$RUNNER_TEMP/pr.json" --jq '.html_url')
            echo "PR 생성: $URL"
          fi

      # ⚠ 반드시 커밋/PR 스텝 '뒤'에 둔다. 앞에 두면 그 시점에는 아직 실패가 없어
      #   건너뛰어지고, 직후 커밋 스텝이 죽으면 최대 120분짜리 산출물이 통째로
      #   유실된다(실측: git add 실패로 54분 결과물을 못 건졌다).
      #   맨 뒤에 있으면 lint 실패·커밋 실패·PR 실패를 모두 잡는다.
      - name: Upload generated docs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-output-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.DOCS_ROOT }}/
            AGENTS.md
            CLAUDE.md
            GEMINI.md

      - name: Job summary
        if: always()
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          ACTUAL_MODE: ${{ steps.scope.outputs.mode }}
          REASON: ${{ steps.scope.outputs.reason }}
          FILE_COUNT: ${{ steps.scope.outputs.count }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          {
            echo "### LLM Wiki Pipeline"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 요청 모드 | \`${REQUESTED_MODE}\` |"
            echo "| 실제 모드 | \`${ACTUAL_MODE:--}\` |"
            echo "| 판정 근거 | ${REASON:--} |"
            echo "| 변경 소스 파일 수 | ${FILE_COUNT:--} |"
            echo "| 커밋 발생 | ${CHANGED:-false} |"
            echo "| 브랜치 | \`${BRANCH:--}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
